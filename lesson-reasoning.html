<script type="application/json" id="lessonData">[{"key":"辅佐","pinyin":"fǔ zuǒ","meaning":"帮助地位较高的人处理事务、完成目标。","collocations":["辅佐领导","辅佐他完成事业","从旁辅佐"],"example":"她一路辅佐对方走到了更高的位置。"},{"key":"释放情绪","pinyin":"","meaning":"把压抑或积累的情绪表达、发泄出来。","collocations":["适当释放情绪","及时释放情绪"],"example":"有时人需要先释放情绪，才听得进道理。"},{"key":"绩效考核","pinyin":"","meaning":"对工作成果、表现进行评估的制度或过程。","collocations":["绩效考核方案","进行绩效考核"],"example":"公司需要把绩效考核和利益分配说明清楚。"},{"key":"画大饼","pinyin":"","meaning":"口语，比喻只描绘美好前景，却不给实际利益或兑现。","collocations":["只会画大饼","给员工画大饼"],"example":"如果只会画大饼，却不给实际回报，很难长期留住员工。"},{"key":"撞南墙","pinyin":"","meaning":"比喻亲自碰到挫折或失败后才醒悟。","collocations":["不撞南墙不回头","让他自己撞南墙"],"example":"有些事情别人怎么劝都没用，只能让他自己去撞南墙。"},{"key":"掏心掏肺","pinyin":"","meaning":"形容非常真诚，把心里话毫无保留地说出来。","collocations":["掏心掏肺地说","对朋友掏心掏肺"],"example":"父母常常是掏心掏肺地给孩子讲自己的经验。"},{"key":"叛逆","pinyin":"","meaning":"不愿服从、喜欢反抗既有要求或规则。","collocations":["青春期叛逆","比较叛逆","出现叛逆心理"],"example":"初中阶段的孩子常常会表现出一些叛逆。"},{"key":"上进心","pinyin":"","meaning":"希望自己不断进步、变得更好的愿望。","collocations":["很有上进心","缺乏上进心","激发上进心"],"example":"不能只从表面判断一个孩子有没有上进心。"},{"key":"通俗易懂","pinyin":"","meaning":"表达浅显，让普通人容易理解。","collocations":["讲得通俗易懂","通俗易懂的解释"],"example":"复杂概念也可以讲得通俗易懂。"},{"key":"全力以赴","pinyin":"","meaning":"把全部力量和精力都投入进去。","collocations":["全力以赴地做","为目标全力以赴"],"example":"与其反复争论，不如全力以赴把事情做好。"},{"key":"皆大欢喜","pinyin":"","meaning":"大家都很满意、很高兴。","collocations":["最后皆大欢喜","实现皆大欢喜"],"example":"结果做好了，很多争论自然也会变成皆大欢喜。"},{"key":"熙熙攘攘","pinyin":"xī xī rǎng rǎng","meaning":"形容人来人往，非常热闹拥挤。","collocations":["街上熙熙攘攘","人群熙熙攘攘"],"example":"下班时间，地铁站里总是熙熙攘攘。"},{"key":"互不相让","pinyin":"","meaning":"双方都不肯退让。","collocations":["争论时互不相让","双方互不相让"],"example":"两个人都互不相让，矛盾就很容易升级。"},{"key":"口无遮拦","pinyin":"","meaning":"说话没有顾忌，想到什么就说什么。","collocations":["说话口无遮拦","网上口无遮拦"],"example":"网络交流中，有些人说话很容易口无遮拦。"},{"key":"一本正经","pinyin":"","meaning":"形容态度很严肃、认真。","collocations":["一本正经地解释","一脸一本正经"],"example":"别人故意挑衅时，没必要还一本正经地跟他讲道理。"},{"key":"气味相投","pinyin":"","meaning":"比喻性格、兴趣、想法相近，很合得来。","collocations":["两人气味相投","彼此气味相投"],"example":"共同经历多的人往往更容易气味相投。"},{"key":"圈层属性","pinyin":"","meaning":"某一群体因知识、经验、生活背景相似而形成的共同特征。","collocations":["具有圈层属性","带有圈层属性"],"example":"很多常识和表达都带有一定的圈层属性。"},{"key":"起老茧","pinyin":"qǐ lǎo jiǎn","meaning":"本指皮肤长期摩擦变硬，文中比喻同样的话听得太多。","collocations":["耳朵都起老茧了","听得耳朵起老茧"],"example":"这种大道理员工已经听得耳朵都起老茧了。"},{"key":"共赢","pinyin":"","meaning":"双方或多方都获得好处。","collocations":["合作共赢","实现共赢","持久共赢"],"example":"好的沟通应该让关系更舒服，也更容易走向长期共赢。"}]</script>

(function(){
 const data=JSON.parse(document.getElementById('lessonData').textContent);
 window.bindLessonTerms=function(data){

   chips.forEach((b,i)=>b.addEventListener('click',()=>renderTerm(i))); marks.forEach(b=>b.addEventListener('click',()=>{renderTerm(Number(b.dataset.term));document.querySelector('.focus-box').scrollIntoView({behavior:'smooth',block:'start'});})); renderTerm(0);
 }; window.bindLessonTerms(data);
})();
