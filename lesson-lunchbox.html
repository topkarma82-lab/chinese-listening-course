<script type="application/json" id="lessonData">[{"key":"南征北战","meaning":"到处奔波、经历很多地方或战斗；文中指工作足迹很广。","collocations":["多年南征北战","四处南征北战"],"example":"他年轻时跟着剧组南征北战，去过很多国家。"},{"key":"面不改色","meaning":"脸色没有变化，形容非常镇定或毫不在意。","collocations":["面不改色地说","依然面不改色"],"example":"面对突然的问题，他仍然面不改色。"},{"key":"贫乏","meaning":"缺少、不丰富。","collocations":["内容贫乏","生活贫乏","资源贫乏"],"example":"如果长期不阅读，表达内容容易变得贫乏。"},{"key":"犒赏","pinyin":"kào shǎng","meaning":"用食物、礼物等慰劳有功或辛苦的人。","collocations":["犒赏员工","犒赏自己","作为犒赏"],"example":"项目完成后，大家一起吃饭犒赏自己。"},{"key":"应有尽有","meaning":"应该有的东西全都有，形容非常齐全。","collocations":["设施应有尽有","商品应有尽有","各种东西应有尽有"],"example":"这家商场商品种类很多，几乎应有尽有。"},{"key":"蔚为奇观","pinyin":"wèi wéi qí guān","meaning":"形成非常壮观、令人惊奇的景象。","collocations":["场面蔚为奇观","景象蔚为奇观"],"example":"几百人同时工作，场面蔚为奇观。"},{"key":"炫耀","meaning":"刻意向别人显示自己的优点或拥有的东西。","collocations":["向别人炫耀","炫耀成绩","炫耀财富"],"example":"真正有实力的人往往不需要到处炫耀。"},{"key":"入乡随俗","meaning":"到了一个地方，就适应当地的习惯和风俗。","collocations":["懂得入乡随俗","到了当地就入乡随俗"],"example":"到国外生活，很多时候需要入乡随俗。"},{"key":"依样画葫芦","meaning":"照着现成的样子模仿。","collocations":["照着依样画葫芦","不能只会依样画葫芦"],"example":"学习方法不能完全依样画葫芦，要根据自己情况调整。"},{"key":"不妥","meaning":"不合适、不稳妥。","collocations":["觉得不妥","这样做不妥","处理不妥"],"example":"在没有确认之前直接答应，我觉得有些不妥。"},{"key":"讲究","meaning":"重视某种标准、做法或品质。","collocations":["很讲究","讲究方法","讲究品质"],"example":"这家店对食材和做法都很讲究。"},{"key":"猖狂","pinyin":"chāng kuáng","meaning":"行为放肆、势头很强，通常带贬义。","collocations":["盗版猖狂","犯罪猖狂","一度非常猖狂"],"example":"当时盗版十分猖狂，对行业影响很大。"},{"key":"鞠躬","pinyin":"jū gōng","meaning":"弯身行礼；文中比喻适时退出舞台。","collocations":["鞠躬致谢","深深鞠躬","鞠躬下台"],"example":"演出结束后，演员向观众鞠躬致谢。"},{"key":"黄金时代","meaning":"某个领域发展最好、最繁荣的一段时期。","collocations":["进入黄金时代","行业黄金时代"],"example":"那几年被很多人称为行业的黄金时代。"},{"key":"怀念","meaning":"对过去的人、事或生活产生想念。","collocations":["怀念过去","令人怀念","十分怀念"],"example":"他偶尔还会怀念年轻时忙碌的工作日子。"}]</script>
<script>
(function(){
 const data=JSON.parse(document.getElementById('lessonData').textContent);
 window.bindLessonTerms=function(data){
   const detail=document.getElementById('wordDetail'); const chips=[...document.querySelectorAll('.term-chip')]; const marks=[...document.querySelectorAll('.marked-term')];
   function renderTerm(i){ const t=data[i]; if(!t||!detail)return; chips.forEach((x,idx)=>x.classList.toggle('active',idx===i)); const p=t.pinyin?`<span class="word-pinyin">${t.pinyin}</span>`:''; detail.innerHTML=`<div class="word-title-row"><div class="word-title">${t.key}</div>${p}</div><p class="meaning">${t.meaning}</p><div class="detail-label">常用搭配</div><div class="collocations">${t.collocations.map(x=>`<span class="collocation">${x}</span>`).join('')}</div><div class="detail-label">例句</div><p class="example">${t.example}</p>`; }
   chips.forEach((b,i)=>b.addEventListener('click',()=>renderTerm(i))); marks.forEach(b=>b.addEventListener('click',()=>{renderTerm(Number(b.dataset.term));document.querySelector('.focus-box').scrollIntoView({behavior:'smooth',block:'start'});})); renderTerm(0);
 }; window.bindLessonTerms(data);
})();
