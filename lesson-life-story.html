<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>生命是一个说故事的人｜中文精听</title>
<style>
:root{--bg:#f7f5ef;--paper:#fffefb;--ink:#202733;--muted:#737980;--green:#49685a;--line:#e8e2d6;--mark:#fff0a6;--chip:#f4f1e8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.85}
.wrap{max-width:900px;margin:0 auto;padding:44px 22px 72px}
.back{display:inline-block;color:#66706b;text-decoration:none;font-size:14px;margin-bottom:20px}
.kicker{font-size:14px;font-weight:700;color:var(--green);letter-spacing:.05em}
h1{margin:6px 0 4px;font-size:clamp(30px,5vw,44px);line-height:1.25;letter-spacing:-.025em}
.sub{font-size:14px;color:var(--muted)}
.player,.focus-box,.paper{background:var(--paper);border:1px solid var(--line);border-radius:18px}
.player{margin:24px 0 18px;padding:16px 18px}
audio{display:block;width:100%}
.focus-box{padding:22px 24px;margin-bottom:18px}
.focus-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px}
.focus-head h2,.paper h2{margin:0;font-size:21px}
.small-hint{font-size:13px;color:var(--muted)}
.term-list{display:flex;flex-wrap:wrap;gap:9px}
.term-chip{appearance:none;border:1px solid #e5dfd2;background:var(--chip);color:#39414a;border-radius:999px;padding:8px 12px;cursor:pointer;font:inherit;font-size:15px;display:inline-flex;gap:5px;align-items:baseline}
.term-chip.active{background:#273b33;color:white;border-color:#273b33}
.chip-pinyin{font-size:11px;opacity:.75}
.word-detail{margin-top:16px;padding:18px 19px;background:#faf9f5;border:1px solid #ece7dc;border-radius:14px}
.word-title-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.word-title{font-size:22px;font-weight:750}
.word-pinyin{font-size:14px;color:#8a6b28}
.meaning{margin:4px 0 12px;color:#505760}
.detail-label{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 7px;letter-spacing:.04em}
.collocations{display:flex;flex-wrap:wrap;gap:7px}
.collocation{background:white;border:1px solid #e6e1d7;border-radius:8px;padding:5px 9px;font-size:15px}
.example{margin:0;color:#343b43}
.paper{padding:28px 30px}
.paper-head{display:flex;align-items:end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:17px}
.transcript p{font-size:18px;margin:0 0 17px;letter-spacing:.005em}
.marked-term{font:inherit;color:inherit;border:0;border-bottom:2px solid #dfbd38;background:linear-gradient(transparent 55%,var(--mark) 55%);padding:0 2px;cursor:pointer;border-radius:3px}
.footer{text-align:center;color:#a19a8f;font-size:12px;margin-top:26px}
@media(max-width:600px){
 .wrap{padding:28px 13px 55px}
 .focus-box,.paper{padding:19px 16px;border-radius:14px}
 .term-chip{font-size:14px;padding:7px 10px}
 .transcript p{font-size:17px}
 .focus-head,.paper-head{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="index.html">← 返回课程首页</a>
  <header>
    <div class="kicker">中文精听 · 人物与人生</div>
    <h1>生命是一个说故事的人</h1>
    <div class="sub">听音频 · 看文字稿 · 学重点词语</div>
  </header>
  <section class="player">
    <audio controls preload="metadata" src="生命是一个说故事的人.m4a"></audio>
  </section>
  <section class="focus-box">
    <div class="focus-head"><h2>重点词语</h2><div class="small-hint">点击词语，查看搭配与例句</div></div>
    <div class="term-list"><button class="term-chip active" data-term="0" type="button"><span>恬静悠闲</span><span class="chip-pinyin">tián jìng yōu xián</span></button><button class="term-chip" data-term="1" type="button"><span>人山人海</span></button><button class="term-chip" data-term="2" type="button"><span>褴褛蹒跚</span><span class="chip-pinyin">lán lǚ pán shān</span></button><button class="term-chip" data-term="3" type="button"><span>喧天震地</span><span class="chip-pinyin">xuān tiān zhèn dì</span></button><button class="term-chip" data-term="4" type="button"><span>虚度</span></button><button class="term-chip" data-term="5" type="button"><span>空虚落寞</span></button><button class="term-chip" data-term="6" type="button"><span>驱遣</span><span class="chip-pinyin">qū qiǎn</span></button><button class="term-chip" data-term="7" type="button"><span>生生不息</span></button><button class="term-chip" data-term="8" type="button"><span>念念常新</span></button><button class="term-chip" data-term="9" type="button"><span>顷刻</span><span class="chip-pinyin">qǐng kè</span></button><button class="term-chip" data-term="10" type="button"><span>心满意足</span></button><button class="term-chip" data-term="11" type="button"><span>追溯</span><span class="chip-pinyin">zhuī sù</span></button><button class="term-chip" data-term="12" type="button"><span>长生不朽</span></button><button class="term-chip" data-term="13" type="button"><span>奢侈</span><span class="chip-pinyin">shē chǐ</span></button><button class="term-chip" data-term="14" type="button"><span>高一筹</span></button><button class="term-chip" data-term="15" type="button"><span>密不通风</span></button><button class="term-chip" data-term="16" type="button"><span>宽恕</span><span class="chip-pinyin">kuān shù</span></button></div>
    <div class="word-detail" id="wordDetail"></div>
  </section>
  <section class="paper">
    <div class="paper-head"><h2>字幕 / 文字稿</h2><div class="small-hint">同一重点词只标第一次出现</div></div>
    <div class="transcript"><p>The requested file reference is not currently visible. Use files.search or files.list to rediscover the file, then retry with a returned ref_id or file_id.</p></div>
  </section>
  <div class="footer">中文精听学习页</div>
</main>
<script>
const DATA=[{"key":"恬静悠闲","pinyin":"tián jìng yōu xián","meaning":"安静、从容，让人感到轻松自在。","collocations":["环境恬静","生活悠闲","恬静的湖面","悠闲自在"],"example":"这里远离城市，环境恬静，生活也很悠闲。"},{"key":"人山人海","meaning":"形容聚集的人非常多。","collocations":["现场人山人海","景区人山人海","人山人海的场面"],"example":"节日期间，景区里人山人海。"},{"key":"褴褛蹒跚","pinyin":"lán lǚ pán shān","meaning":"衣服破旧，走路缓慢不稳。","collocations":["衣衫褴褛","步履蹒跚","蹒跚前行"],"example":"老人步履蹒跚地走过街道。"},{"key":"喧天震地","pinyin":"xuān tiān zhèn dì","meaning":"声音非常大，场面十分喧闹。","collocations":["锣鼓喧天","声音震天","场面喧闹"],"example":"庆典现场锣鼓喧天，非常热闹。"},{"key":"虚度","meaning":"白白地度过，没有得到应有的收获。","collocations":["虚度时光","虚度一天","不愿虚度","虚度年华"],"example":"我不想虚度时间，希望每天都有一点收获。"},{"key":"空虚落寞","meaning":"内心缺少充实感，同时感到孤独寂寞。","collocations":["感到空虚","内心落寞","空虚感","孤独落寞"],"example":"热闹散去以后，他反而感到有些空虚落寞。"},{"key":"驱遣","pinyin":"qū qiǎn","meaning":"驱使、支配，使人去行动。","collocations":["受本能驱使","被欲望驱使","驱使人行动"],"example":"很多行为会受到习惯和欲望的驱使。"},{"key":"生生不息","meaning":"不断地产生和发展，永远不停止。","collocations":["生命生生不息","文化生生不息","生生不息的力量"],"example":"大自然的生命总是在不断变化，生生不息。"},{"key":"念念常新","meaning":"每一个念头、每一个时刻都可以不断更新。","collocations":["保持常新","时时更新","不断产生新意"],"example":"如果愿意重新观察生活，很多熟悉的事物也能念念常新。"},{"key":"顷刻","pinyin":"qǐng kè","meaning":"很短的一段时间；片刻。","collocations":["顷刻之间","转眼顷刻","每一顷刻"],"example":"天气在顷刻之间发生了变化。"},{"key":"心满意足","meaning":"非常满足，没有什么不满意。","collocations":["感到心满意足","令人心满意足","心满意足地离开"],"example":"完成一天的工作以后，他心满意足地回家了。"},{"key":"追溯","pinyin":"zhuī sù","meaning":"沿着时间或线索向过去追寻。","collocations":["追溯历史","追溯原因","追溯到……"],"example":"这个习惯可以追溯到很多年前。"},{"key":"长生不朽","meaning":"希望生命长久、不消失。","collocations":["追求长生","渴望不朽","永垂不朽"],"example":"古人曾用很多方法追求长生不朽。"},{"key":"奢侈","pinyin":"shē chǐ","meaning":"超过一般需要的享受；也可形容某种难得的享受。","collocations":["奢侈的生活","一种奢侈","奢侈品"],"example":"对忙碌的人来说，安静地休息一天有时也是一种奢侈。"},{"key":"高一筹","meaning":"比别人高出一个层次或水平。","collocations":["技高一筹","比别人高一筹","略高一筹"],"example":"在处理复杂问题方面，他的经验比我高一筹。"},{"key":"密不通风","meaning":"非常严密，几乎没有空隙；也可比喻思想封闭。","collocations":["包得密不通风","封得密不通风","密不通风的环境"],"example":"这个房间关得密不通风，让人很不舒服。"},{"key":"宽恕","pinyin":"kuān shù","meaning":"原谅别人的过错，不再追究。","collocations":["宽恕别人","得到宽恕","学会宽恕","请求宽恕"],"example":"理解一个人的处境，有时会让我们更容易宽恕他。"}];
const detail=document.getElementById('wordDetail');
const chips=[...document.querySelectorAll('.term-chip')];
const marks=[...document.querySelectorAll('.marked-term')];
function renderTerm(i){
 const t=DATA[i];
 chips.forEach((x,idx)=>x.classList.toggle('active',idx===i));
 const p=t.pinyin?`<span class="word-pinyin">${t.pinyin}</span>`:'';
 detail.innerHTML=`<div class="word-title-row"><div class="word-title">${t.key}</div>${p}</div>
 <p class="meaning">${t.meaning}</p>
 <div class="detail-label">常用搭配</div>
 <div class="collocations">${t.collocations.map(x=>`<span class="collocation">${x}</span>`).join('')}</div>
 <div class="detail-label">例句</div><p class="example">${t.example}</p>`;
}
chips.forEach((b,i)=>b.addEventListener('click',()=>renderTerm(i)));
marks.forEach(b=>b.addEventListener('click',()=>{renderTerm(Number(b.dataset.term));document.querySelector('.focus-box').scrollIntoView({behavior:'smooth',block:'start'});}));
renderTerm(0);
</script>
</body>
</html>
