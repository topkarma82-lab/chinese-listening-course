<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>张曼娟：人间好时节｜中文精听</title>
<style>
:root{--bg:#f7f5ef;--paper:#fffefb;--ink:#202733;--muted:#737980;--green:#49685a;--line:#e8e2d6;--mark:#fff0a6;--chip:#f4f1e8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.85}
.wrap{max-width:900px;margin:0 auto;padding:44px 22px 72px}
.back{display:inline-block;color:#66706b;text-decoration:none;font-size:14px;margin-bottom:20px}
.kicker{font-size:14px;font-weight:700;color:var(--green);letter-spacing:.05em}
h1{margin:6px 0 4px;font-size:clamp(30px,5vw,44px);line-height:1.25;letter-spacing:-.025em}
.sub{font-size:14px;color:var(--muted)}
.player,.focus-box,.paper{background:var(--paper);border:1px solid var(--line);border-radius:18px}
.player{margin:24px 0 18px;padding:16px 18px}
audio{display:block;width:100%}
.focus-box{padding:22px 24px;margin-bottom:18px}
.focus-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px}
.focus-head h2,.paper h2{margin:0;font-size:21px}
.small-hint{font-size:13px;color:var(--muted)}
.term-list{display:flex;flex-wrap:wrap;gap:9px}
.term-chip{appearance:none;border:1px solid #e5dfd2;background:var(--chip);color:#39414a;border-radius:999px;padding:8px 12px;cursor:pointer;font:inherit;font-size:15px;display:inline-flex;gap:5px;align-items:baseline}
.term-chip.active{background:#273b33;color:white;border-color:#273b33}
.chip-pinyin{font-size:11px;opacity:.75}
.word-detail{margin-top:16px;padding:18px 19px;background:#faf9f5;border:1px solid #ece7dc;border-radius:14px}
.word-title-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.word-title{font-size:22px;font-weight:750}
.word-pinyin{font-size:14px;color:#8a6b28}
.meaning{margin:4px 0 12px;color:#505760}
.detail-label{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 7px;letter-spacing:.04em}
.collocations{display:flex;flex-wrap:wrap;gap:7px}
.collocation{background:white;border:1px solid #e6e1d7;border-radius:8px;padding:5px 9px;font-size:15px}
.example{margin:0;color:#343b43}
.paper{padding:28px 30px}
.paper-head{display:flex;align-items:end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:17px}
.transcript p{font-size:18px;margin:0 0 17px;letter-spacing:.005em}
.marked-term{font:inherit;color:inherit;border:0;border-bottom:2px solid #dfbd38;background:linear-gradient(transparent 55%,var(--mark) 55%);padding:0 2px;cursor:pointer;border-radius:3px}
.footer{text-align:center;color:#a19a8f;font-size:12px;margin-top:26px}
@media(max-width:600px){
 .wrap{padding:28px 13px 55px}
 .focus-box,.paper{padding:19px 16px;border-radius:14px}
 .term-chip{font-size:14px;padding:7px 10px}
 .transcript p{font-size:17px}
 .focus-head,.paper-head{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="index.html">← 返回课程首页</a>
  <header>
    <div class="kicker">中文精听 · 人物与人生</div>
    <h1>张曼娟：人间好时节</h1>
    <div class="sub">听音频 · 看文字稿 · 学重点词语</div>
  </header>
  <section class="player">
    <audio controls preload="metadata" src="张曼娟：人间好时节.m4a"></audio>
  </section>
  <section class="focus-box">
    <div class="focus-head"><h2>重点词语</h2><div class="small-hint">点击词语，查看搭配与例句</div></div>
    <div class="term-list"><button class="term-chip active" data-term="0" type="button"><span>堆砌</span><span class="chip-pinyin">duī qì</span></button><button class="term-chip" data-term="1" type="button"><span>似懂非懂</span></button><button class="term-chip" data-term="2" type="button"><span>驻足</span><span class="chip-pinyin">zhù zú</span></button><button class="term-chip" data-term="3" type="button"><span>哀鸿遍野</span><span class="chip-pinyin">āi hóng biàn yě</span></button><button class="term-chip" data-term="4" type="button"><span>苦不堪言</span></button><button class="term-chip" data-term="5" type="button"><span>多愁善感</span></button><button class="term-chip" data-term="6" type="button"><span>耽溺</span><span class="chip-pinyin">dān nì</span></button><button class="term-chip" data-term="7" type="button"><span>落落寡欢</span><span class="chip-pinyin">luò luò guǎ huān</span></button><button class="term-chip" data-term="8" type="button"><span>慨叹</span><span class="chip-pinyin">kǎi tàn</span></button><button class="term-chip" data-term="9" type="button"><span>座右铭</span><span class="chip-pinyin">zuò yòu míng</span></button><button class="term-chip" data-term="10" type="button"><span>求神问卜</span><span class="chip-pinyin">qiú shén wèn bǔ</span></button><button class="term-chip" data-term="11" type="button"><span>吝惜</span><span class="chip-pinyin">lìn xī</span></button><button class="term-chip" data-term="12" type="button"><span>无所畏惧</span></button><button class="term-chip" data-term="13" type="button"><span>生机盎然</span><span class="chip-pinyin">shēng jī àng rán</span></button><button class="term-chip" data-term="14" type="button"><span>不假外求</span><span class="chip-pinyin">bù jiǎ wài qiú</span></button><button class="term-chip" data-term="15" type="button"><span>执着</span></button><button class="term-chip" data-term="16" type="button"><span>境界</span></button><button class="term-chip" data-term="17" type="button"><span>酷寒砭骨</span><span class="chip-pinyin">kù hán biān gǔ</span></button><button class="term-chip" data-term="18" type="button"><span>抗御</span><span class="chip-pinyin">kàng yù</span></button><button class="term-chip" data-term="19" type="button"><span>诡谲多变</span><span class="chip-pinyin">guǐ jué duō biàn</span></button></div>
    <div class="word-detail" id="wordDetail"></div>
  </section>
  <section class="paper">
    <div class="paper-head"><h2>字幕 / 文字稿</h2><div class="small-hint">同一重点词只标第一次出现</div></div>
    <div class="transcript"><p>The requested file reference is not currently visible. Use files.search or files.list to rediscover the file, then retry with a returned ref_id or file_id.</p></div>
  </section>
  <div class="footer">中文精听学习页</div>
</main>
<script>
const DATA=[{"key":"堆砌","pinyin":"duī qì","meaning":"一层一层地堆起来；也可比喻把内容不断组合起来。","collocations":["堆砌文字","堆砌辞藻","像积木一样堆砌"],"example":"写文章不能只堆砌漂亮的词语。"},{"key":"似懂非懂","meaning":"好像懂了，又没有真正完全明白。","collocations":["听得似懂非懂","似懂非懂地点头","处于似懂非懂的状态"],"example":"第一次听这段内容时，我还有些似懂非懂。"},{"key":"驻足","pinyin":"zhù zú","meaning":"停下脚步。","collocations":["驻足观看","驻足聆听","让人驻足"],"example":"街边的音乐吸引很多路人驻足聆听。"},{"key":"哀鸿遍野","pinyin":"āi hóng biàn yě","meaning":"原指到处都是受苦的人；文中形容大家一片哀叹。","collocations":["一片哀鸿","哀声一片","怨声载道"],"example":"听说又要增加作业，教室里顿时哀声一片。"},{"key":"苦不堪言","meaning":"痛苦到了难以用语言表达的程度。","collocations":["让人苦不堪言","忙得苦不堪言","压力大得苦不堪言"],"example":"连续熬夜工作，让他苦不堪言。"},{"key":"多愁善感","meaning":"容易因为外界事物而产生忧愁和感伤。","collocations":["变得多愁善感","一个多愁善感的人","过于多愁善感"],"example":"年轻时她比较多愁善感，常被诗句打动。"},{"key":"耽溺","pinyin":"dān nì","meaning":"沉迷其中，难以自拔。","collocations":["耽溺于回忆","耽溺于幻想","沉溺其中"],"example":"长期耽溺于过去，会让人忽略现在的生活。"},{"key":"落落寡欢","pinyin":"luò luò guǎ huān","meaning":"心情孤单低落，很少感到快乐。","collocations":["显得落落寡欢","整日落落寡欢","神情落寞"],"example":"那段时间她显得有些落落寡欢。"},{"key":"慨叹","pinyin":"kǎi tàn","meaning":"有所感触而叹息。","collocations":["发出慨叹","令人慨叹","慨叹时光流逝"],"example":"看到旧照片，他不禁慨叹时间过得太快。"},{"key":"座右铭","pinyin":"zuò yòu míng","meaning":"用来提醒和勉励自己的格言。","collocations":["人生座右铭","把……当作座右铭","写下一句座右铭"],"example":"“坚持到底”一直是他的座右铭。"},{"key":"求神问卜","pinyin":"qiú shén wèn bǔ","meaning":"通过求神、占卜等方式询问吉凶。","collocations":["不求神问卜","求神拜佛","占卜吉凶"],"example":"遇到问题时，她习惯自己思考，而不是求神问卜。"},{"key":"吝惜","pinyin":"lìn xī","meaning":"舍不得拿出或给予。","collocations":["不吝惜时间","不吝惜赞美","毫不吝惜"],"example":"真正的老师从不吝惜给学生鼓励。"},{"key":"无所畏惧","meaning":"没有什么值得害怕。","collocations":["勇敢无所畏惧","显得无所畏惧","带着无所畏惧的勇气"],"example":"有了明确目标以后，他做事更加坚定、无所畏惧。"},{"key":"生机盎然","pinyin":"shēng jī àng rán","meaning":"充满生命力和活力。","collocations":["一片生机盎然","显得生机盎然","生机盎然的景象"],"example":"春天一到，公园里到处生机盎然。"},{"key":"不假外求","pinyin":"bù jiǎ wài qiú","meaning":"不必向外部寻找，所需要的就在自身。","collocations":["无需外求","不必外求","向内寻找"],"example":"有些力量不假外求，来自自己的内心。"},{"key":"执着","meaning":"坚持某种目标或想法，不轻易改变。","collocations":["对理想执着","执着追求","过于执着","保持执着"],"example":"他对自己的研究方向一直非常执着。"},{"key":"境界","meaning":"思想、修养或人生体验达到的层次。","collocations":["人生境界","思想境界","一种境界","达到更高境界"],"example":"能欣赏别人的成就，也是一种人生境界。"},{"key":"酷寒砭骨","pinyin":"kù hán biān gǔ","meaning":"寒冷刺骨，冷得非常厉害。","collocations":["寒风刺骨","酷寒难耐","严寒天气"],"example":"北方冬天有时寒风刺骨，非常难熬。"},{"key":"抗御","pinyin":"kàng yù","meaning":"抵抗、抵御。","collocations":["抗御风险","抵御困难","抗御外界影响"],"example":"阅读和思考可以帮助人抗御生活中的挫折。"},{"key":"诡谲多变","pinyin":"guǐ jué duō biàn","meaning":"变化复杂、难以预料。","collocations":["局势多变","变化莫测","复杂多变"],"example":"面对诡谲多变的环境，更需要保持清醒。"}];
const detail=document.getElementById('wordDetail');
const chips=[...document.querySelectorAll('.term-chip')];
const marks=[...document.querySelectorAll('.marked-term')];
function renderTerm(i){
 const t=DATA[i];
 chips.forEach((x,idx)=>x.classList.toggle('active',idx===i));
 const p=t.pinyin?`<span class="word-pinyin">${t.pinyin}</span>`:'';
 detail.innerHTML=`<div class="word-title-row"><div class="word-title">${t.key}</div>${p}</div>
 <p class="meaning">${t.meaning}</p>
 <div class="detail-label">常用搭配</div>
 <div class="collocations">${t.collocations.map(x=>`<span class="collocation">${x}</span>`).join('')}</div>
 <div class="detail-label">例句</div><p class="example">${t.example}</p>`;
}
chips.forEach((b,i)=>b.addEventListener('click',()=>renderTerm(i)));
marks.forEach(b=>b.addEventListener('click',()=>{renderTerm(Number(b.dataset.term));document.querySelector('.focus-box').scrollIntoView({behavior:'smooth',block:'start'});}));
renderTerm(0);
</script>
</body>
</html>
