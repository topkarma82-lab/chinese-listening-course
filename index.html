<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>中文精听</title>
<style>
:root{--bg:#f7f5ef;--paper:#fffefb;--ink:#202733;--muted:#737980;--green:#294037;--line:#e8e2d6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.shell{max-width:1080px;margin:auto;padding:46px 24px 70px}
header{margin:0 0 32px 200px}
.kicker{font-size:14px;font-weight:700;color:#49685a;letter-spacing:.08em}
h1{font-size:clamp(34px,5vw,50px);line-height:1.12;margin:7px 0 10px;letter-spacing:-.03em}
.lead{color:#62696b;font-size:17px;line-height:1.7;margin:0}
.layout{display:grid;grid-template-columns:170px 1fr;gap:30px;align-items:start}
.sidebar{position:sticky;top:22px}
.side-title{font-size:13px;color:#8b8f8c;margin:0 0 10px 4px}
.side-filter{width:100%;border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:11px;font:inherit;font-size:16px;color:#4d5557;cursor:pointer;margin-bottom:5px}
.side-filter:hover{background:#efede7}
.side-filter.active{background:var(--green);color:white;font-weight:650}
.content-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}
.content-head h2{margin:0;font-size:23px}
.result-count{font-size:13px;color:#8b8f8d}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.course-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;min-height:172px;display:flex;flex-direction:column}
.card-top{display:flex;justify-content:space-between;align-items:center}
.lesson-no{font-weight:800;color:#919591;font-size:13px}
.category{font-size:13px;color:#75807a}
h3{font-size:19px;line-height:1.45;margin:14px 0 16px;font-weight:650}
.enter{margin-top:auto;text-decoration:none;color:#fff;background:#49685a;border-radius:10px;padding:9px 12px;text-align:center;font-size:14px}
@media(max-width:760px){
 .shell{padding:30px 14px 55px}
 header{margin-left:0}
 .layout{grid-template-columns:1fr;gap:18px}
 .sidebar{position:static;display:flex;gap:8px;overflow-x:auto;padding-bottom:3px}
 .side-title{display:none}
 .side-filter{width:auto;white-space:nowrap;margin:0;border:1px solid var(--line);background:var(--paper);padding:9px 13px;border-radius:999px}
 .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<main class="shell">
<header>
  <div class="kicker">中文精听</div>
  <h1>听真实中文，学自然表达。</h1>
  <p class="lead">选择一个主题，进入具体课程。</p>
</header>

<section class="layout">
  <aside class="sidebar">
    <div class="side-title">课程分类</div>
    <button class="side-filter active" data-filter="全部">全部</button>
    <button class="side-filter" data-filter="工作与成长">工作与成长</button>
    <button class="side-filter" data-filter="人物与人生">人物与人生</button>
  </aside>

  <div>
    <div class="content-head">
      <h2 id="sectionTitle">全部课程</h2>
      <span class="result-count" id="resultCount">6课</span>
    </div>
    <section class="grid">
      <article class="course-card" data-cat="工作与成长">
        <div class="card-top"><span class="lesson-no">01</span><span class="category">工作与成长</span></div>
        <h3>如何确定人生目标</h3>
        <a class="enter" href="如何确定人生目标_V2标准版.html">进入学习</a>
      </article>

      <article class="course-card" data-cat="工作与成长">
        <div class="card-top"><span class="lesson-no">02</span><span class="category">工作与成长</span></div>
        <h3>怀念吃盒饭的日子</h3>
        <a class="enter" href="lesson-lunchbox.html">进入学习</a>
      </article>

      <article class="course-card" data-cat="人物与人生">
        <div class="card-top"><span class="lesson-no">03</span><span class="category">人物与人生</span></div>
        <h3>生命是一个说故事的人</h3>
        <a class="enter" href="lesson-life-story.html">进入学习</a>
      </article>

      <article class="course-card" data-cat="人物与人生">
        <div class="card-top"><span class="lesson-no">04</span><span class="category">人物与人生</span></div>
        <h3>张曼娟：人间好时节</h3>
        <a class="enter" href="lesson-renjian.html">进入学习</a>
      </article>

      <article class="course-card" data-cat="人物与人生">
        <div class="card-top"><span class="lesson-no">05</span><span class="category">人物与人生</span></div>
        <h3>我的父亲</h3>
        <a class="enter" href="lesson-father.html">进入学习</a>
      </article>

      <article class="course-card" data-cat="人物与人生">
        <div class="card-top"><span class="lesson-no">06</span><span class="category">人物与人生</span></div>
        <h3>马未都《背影》：老人叶圣陶</h3>
        <a class="enter" href="lesson-yeshengtao.html">进入学习</a>
      </article>
    </section>
  </div>
</section>
</main>
<script>
const filters=[...document.querySelectorAll('.side-filter')];
const cards=[...document.querySelectorAll('.course-card')];
const title=document.getElementById('sectionTitle');
const count=document.getElementById('resultCount');
filters.forEach(btn=>btn.addEventListener('click',()=>{
  filters.forEach(x=>x.classList.remove('active'));
  btn.classList.add('active');
  const f=btn.dataset.filter;
  let visible=0;
  cards.forEach(c=>{
    const show=f==='全部'||c.dataset.cat===f;
    c.style.display=show?'flex':'none';
    if(show) visible++;
  });
  title.textContent=f==='全部'?'全部课程':f;
  count.textContent=visible+'课';
}));
</script>
</body>
</html>
