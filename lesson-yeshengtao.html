<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>马未都《背影》：老人叶圣陶｜中文精听</title>
<style>
:root{--bg:#f7f5ef;--paper:#fffefb;--ink:#202733;--muted:#737980;--green:#49685a;--line:#e8e2d6;--mark:#fff0a6;--chip:#f4f1e8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.85}
.wrap{max-width:900px;margin:0 auto;padding:44px 22px 72px}
.back{display:inline-block;color:#66706b;text-decoration:none;font-size:14px;margin-bottom:20px}
.kicker{font-size:14px;font-weight:700;color:var(--green);letter-spacing:.05em}
h1{margin:6px 0 4px;font-size:clamp(30px,5vw,44px);line-height:1.25;letter-spacing:-.025em}
.sub{font-size:14px;color:var(--muted)}
.player,.focus-box,.paper{background:var(--paper);border:1px solid var(--line);border-radius:18px}
.player{margin:24px 0 18px;padding:16px 18px}
audio{display:block;width:100%}
.focus-box{padding:22px 24px;margin-bottom:18px}
.focus-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px}
.focus-head h2,.paper h2{margin:0;font-size:21px}
.small-hint{font-size:13px;color:var(--muted)}
.term-list{display:flex;flex-wrap:wrap;gap:9px}
.term-chip{appearance:none;border:1px solid #e5dfd2;background:var(--chip);color:#39414a;border-radius:999px;padding:8px 12px;cursor:pointer;font:inherit;font-size:15px;display:inline-flex;gap:5px;align-items:baseline}
.term-chip.active{background:#273b33;color:white;border-color:#273b33}
.chip-pinyin{font-size:11px;opacity:.75}
.word-detail{margin-top:16px;padding:18px 19px;background:#faf9f5;border:1px solid #ece7dc;border-radius:14px}
.word-title-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.word-title{font-size:22px;font-weight:750}
.word-pinyin{font-size:14px;color:#8a6b28}
.meaning{margin:4px 0 12px;color:#505760}
.detail-label{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 7px;letter-spacing:.04em}
.collocations{display:flex;flex-wrap:wrap;gap:7px}
.collocation{background:white;border:1px solid #e6e1d7;border-radius:8px;padding:5px 9px;font-size:15px}
.example{margin:0;color:#343b43}
.paper{padding:28px 30px}
.paper-head{display:flex;align-items:end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:17px}
.transcript p{font-size:18px;margin:0 0 17px;letter-spacing:.005em}
.marked-term{font:inherit;color:inherit;border:0;border-bottom:2px solid #dfbd38;background:linear-gradient(transparent 55%,var(--mark) 55%);padding:0 2px;cursor:pointer;border-radius:3px}
.footer{text-align:center;color:#a19a8f;font-size:12px;margin-top:26px}
@media(max-width:600px){
 .wrap{padding:28px 13px 55px}
 .focus-box,.paper{padding:19px 16px;border-radius:14px}
 .term-chip{font-size:14px;padding:7px 10px}
 .transcript p{font-size:17px}
 .focus-head,.paper-head{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<main class="wrap">
  <a class="back" href="index.html">← 返回课程首页</a>
  <header>
    <div class="kicker">中文精听 · 人物与人生</div>
    <h1>马未都《背影》：老人叶圣陶</h1>
    <div class="sub">听音频 · 看文字稿 · 学重点词语</div>
  </header>
  <section class="player">
    <audio controls preload="metadata" src="radio/《背影》老人叶圣陶.mp3"></audio>
  </section>
  <section class="focus-box">
    <div class="focus-head"><h2>重点词语</h2><div class="small-hint">点击词语，查看搭配与例句</div></div>
    <div class="term-list"><button class="term-chip active" data-term="0" type="button"><span>昭示</span><span class="chip-pinyin">zhāo shì</span></button><button class="term-chip" data-term="1" type="button"><span>突兀</span><span class="chip-pinyin">tū wù</span></button><button class="term-chip" data-term="2" type="button"><span>轻叩</span><span class="chip-pinyin">qīng kòu</span></button><button class="term-chip" data-term="3" type="button"><span>阔绰</span><span class="chip-pinyin">kuò chuò</span></button><button class="term-chip" data-term="4" type="button"><span>冬暖夏凉</span></button><button class="term-chip" data-term="5" type="button"><span>大巧若拙</span><span class="chip-pinyin">dà qiǎo ruò zhuō</span></button><button class="term-chip" data-term="6" type="button"><span>懵懵懂懂</span><span class="chip-pinyin">měng měng dǒng dǒng</span></button><button class="term-chip" data-term="7" type="button"><span>触景生情</span></button><button class="term-chip" data-term="8" type="button"><span>高山仰止</span><span class="chip-pinyin">gāo shān yǎng zhǐ</span></button><button class="term-chip" data-term="9" type="button"><span>笑容可掬</span><span class="chip-pinyin">xiào róng kě jū</span></button><button class="term-chip" data-term="10" type="button"><span>如饥似渴</span></button><button class="term-chip" data-term="11" type="button"><span>禁锢</span><span class="chip-pinyin">jìn gù</span></button><button class="term-chip" data-term="12" type="button"><span>刻骨铭心</span></button><button class="term-chip" data-term="13" type="button"><span>死乞白赖</span><span class="chip-pinyin">sǐ qǐ bái lài</span></button><button class="term-chip" data-term="14" type="button"><span>吞吞吐吐</span></button><button class="term-chip" data-term="15" type="button"><span>岔开话题</span></button><button class="term-chip" data-term="16" type="button"><span>氤氲</span><span class="chip-pinyin">yīn yūn</span></button><button class="term-chip" data-term="17" type="button"><span>慈眉善目</span></button><button class="term-chip" data-term="18" type="button"><span>余晖</span><span class="chip-pinyin">yú huī</span></button></div>
    <div class="word-detail" id="wordDetail"></div>
  </section>
  <section class="paper">
    <div class="paper-head"><h2>字幕 / 文字稿</h2><div class="small-hint">同一重点词只标第一次出现</div></div>
    <div class="transcript"><p>The requested file reference is not currently visible. Use files.search or files.list to rediscover the file, then retry with a returned ref_id or file_id.</p></div>
  </section>
  <div class="footer">中文精听学习页</div>
</main>
<script>
const DATA=[{"key":"昭示","pinyin":"zhāo shì","meaning":"明显地显示、说明。","collocations":["昭示历史","昭示变化","向人们昭示"],"example":"这些老建筑仍然昭示着胡同过去的生活。"},{"key":"突兀","pinyin":"tū wù","meaning":"高起或显得很不协调、很突然。","collocations":["显得突兀","十分突兀","突兀地出现"],"example":"一栋高楼出现在老胡同里，显得有些突兀。"},{"key":"轻叩","pinyin":"qīng kòu","meaning":"轻轻地敲。","collocations":["轻叩门环","轻叩房门","轻轻敲门"],"example":"他走到门前，轻叩了两下房门。"},{"key":"阔绰","pinyin":"kuò chuò","meaning":"生活排场大、条件宽裕。","collocations":["出手阔绰","生活阔绰","显得阔绰"],"example":"在那个年代，这样的院子已经显得非常阔绰。"},{"key":"冬暖夏凉","meaning":"冬天温暖，夏天凉爽。","collocations":["房间冬暖夏凉","冬暖夏凉的房子","保持冬暖夏凉"],"example":"这间屋子朝向很好，冬暖夏凉。"},{"key":"大巧若拙","pinyin":"dà qiǎo ruò zhuō","meaning":"真正高明的人或做法看起来反而朴素、不炫耀。","collocations":["大巧若拙的设计","朴素自然","看似简单却很高明"],"example":"这个名字看起来普通，却有大巧若拙的意味。"},{"key":"懵懵懂懂","pinyin":"měng měng dǒng dǒng","meaning":"似懂非懂，不十分明白。","collocations":["懵懵懂懂地理解","还是懵懵懂懂","一知半解"],"example":"小时候读这句话，我只是懵懵懂懂地理解。"},{"key":"触景生情","meaning":"看到眼前景象而产生感情或回忆。","collocations":["让人触景生情","触景生情地想起","因景生情"],"example":"重回旧居，他很容易触景生情。"},{"key":"高山仰止","pinyin":"gāo shān yǎng zhǐ","meaning":"比喻对品德高尚或成就卓越的人十分敬仰。","collocations":["令人高山仰止","心生敬仰","十分敬重"],"example":"对年轻的他来说，叶圣陶是一位令人高山仰止的长者。"},{"key":"笑容可掬","pinyin":"xiào róng kě jū","meaning":"满脸都是笑容，形容十分和蔼亲切。","collocations":["笑容可掬地迎接","总是笑容可掬","面带笑容"],"example":"老人笑容可掬，让紧张的孩子放松了下来。"},{"key":"如饥似渴","meaning":"形容要求非常迫切，常用于学习知识。","collocations":["如饥似渴地读书","如饥似渴地学习","求知若渴"],"example":"那一代年轻人曾如饥似渴地寻找各种书来读。"},{"key":"禁锢","pinyin":"jìn gù","meaning":"限制、束缚，使人不能自由行动或思想。","collocations":["思想禁锢","打破禁锢","受到禁锢","摆脱禁锢"],"example":"知识可以帮助人打破一些固有观念的禁锢。"},{"key":"刻骨铭心","meaning":"印象极深，永远难以忘记。","collocations":["令人刻骨铭心","刻骨铭心的经历","留下刻骨铭心的记忆"],"example":"那次丢书的经历让他刻骨铭心。"},{"key":"死乞白赖","pinyin":"sǐ qǐ bái lài","meaning":"纠缠不休、硬要达到目的，口语色彩较强。","collocations":["死乞白赖地要求","一再纠缠","非要不可"],"example":"朋友死乞白赖地要先借这本书看。"},{"key":"吞吞吐吐","meaning":"想说又不敢说，说话不干脆。","collocations":["说话吞吞吐吐","吞吞吐吐地解释","支支吾吾"],"example":"做错事情以后，他解释得吞吞吐吐。"},{"key":"岔开话题","meaning":"把正在谈的话题转到别的内容。","collocations":["故意岔开话题","把话题岔开","转移话题"],"example":"看到对方很尴尬，他主动岔开了话题。"},{"key":"氤氲","pinyin":"yīn yūn","meaning":"烟雾、气息弥漫的样子，也常用于文学描写。","collocations":["烟雾氤氲","氤氲之气","水汽氤氲"],"example":"清晨的湖面水汽氤氲，很有诗意。"},{"key":"慈眉善目","meaning":"形容人面容和善、亲切。","collocations":["慈眉善目的老人","看起来慈眉善目","神态和善"],"example":"那位老人慈眉善目，很容易让人产生亲近感。"},{"key":"余晖","pinyin":"yú huī","meaning":"傍晚太阳留下的光辉。","collocations":["夕阳余晖","沐浴在余晖中","余晖满天"],"example":"老人静静坐在夕阳的余晖里。"}];
const detail=document.getElementById('wordDetail');
const chips=[...document.querySelectorAll('.term-chip')];
const marks=[...document.querySelectorAll('.marked-term')];
function renderTerm(i){
 const t=DATA[i];
 chips.forEach((x,idx)=>x.classList.toggle('active',idx===i));
 const p=t.pinyin?`<span class="word-pinyin">${t.pinyin}</span>`:'';
 detail.innerHTML=`<div class="word-title-row"><div class="word-title">${t.key}</div>${p}</div>
 <p class="meaning">${t.meaning}</p>
 <div class="detail-label">常用搭配</div>
 <div class="collocations">${t.collocations.map(x=>`<span class="collocation">${x}</span>`).join('')}</div>
 <div class="detail-label">例句</div><p class="example">${t.example}</p>`;
}
chips.forEach((b,i)=>b.addEventListener('click',()=>renderTerm(i)));
marks.forEach(b=>b.addEventListener('click',()=>{renderTerm(Number(b.dataset.term));document.querySelector('.focus-box').scrollIntoView({behavior:'smooth',block:'start'});}));
renderTerm(0);
</script>
</body>
</html>
